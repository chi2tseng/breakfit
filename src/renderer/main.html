<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file:; font-src 'self' file:; img-src 'self' data: file:">
<title translate="no">BreakFit</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/noto-sans-tc/wght.css">
<link rel="stylesheet" href="../../node_modules/material-symbols/outlined.css">
<script src="../i18n.js"></script>
<script src="theme.js"></script>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="main.css">
</head>
<body>
  <nav id="side">
    <div class="brand"><span class="logo"></span><span class="brand-name" translate="no">BreakFit</span></div>
    <button class="nav-item active" data-tab="today" data-i18n-title="navToday"><span aria-hidden="true" class="ms">today</span><span class="nav-label" data-i18n="navToday"></span></button>
    <button class="nav-item" data-tab="history" data-i18n-title="navHistory"><span aria-hidden="true" class="ms">calendar_month</span><span class="nav-label" data-i18n="navHistory"></span></button>
    <button class="nav-item" data-tab="settings" data-i18n-title="navSettings"><span aria-hidden="true" class="ms">tune</span><span class="nav-label" data-i18n="navSettings"></span></button>
  </nav>

  <main id="content">
    <!-- 今天 -->
    <section class="tab" id="tab-today">
      <header class="page-head">
        <div class="head-text"><div class="eyebrow" id="todayLabel"></div><h1 id="todayTitle"></h1></div>
        <button class="btn primary" id="breakNowBtn"><span aria-hidden="true" class="ms fill">play_arrow</span><span data-i18n="breakNow"></span></button>
      </header>
      <div class="panel hero" id="hero">
        <div class="clip hero-clip" id="heroClip"></div>
        <div class="hero-text" id="heroText"></div>
      </div>
      <div class="day-line" id="dayLine">
        <ol class="line" id="timeline"></ol>
        <div class="prog" id="prog"></div>
      </div>
      <section class="lib">
        <div class="panel-head"><h2 data-i18n="library"></h2>
          <div class="seg" id="libFilter">
            <button data-f="d1" class="on" data-i18n="d1"></button><button data-f="d2" data-i18n="d2"></button><button data-f="d3" data-i18n="d3"></button><button data-f="stretch" data-i18n="stretch"></button>
          </div>
        </div>
        <div class="lib-grid" id="library"></div>
      </section>
    </section>

    <!-- 記錄 -->
    <section class="tab" id="tab-history" hidden>
      <header class="page-head"><h1 data-i18n="historyTitle"></h1></header>
      <div class="streak-row">
        <p class="streak" id="streak"></p>
        <div class="stats" id="stats"></div>
      </div>
      <div class="hist-grid">
        <div class="panel" id="calPanel">
          <div class="panel-head cal-head">
            <button class="icon-btn" id="prevMonth" data-i18n-aria="prevMonth"><span aria-hidden="true" class="ms">chevron_left</span></button>
            <h2 id="monthLabel"></h2>
            <button class="icon-btn" id="nextMonth" data-i18n-aria="nextMonth"><span aria-hidden="true" class="ms">chevron_right</span></button>
          </div>
          <div class="cal-week" id="calWeek"></div>
          <div class="cal" id="calendar"></div>
        </div>
        <aside class="panel detail" id="detail"></aside>
        <section class="chart-sec" id="chartSec">
          <div class="panel-head"><h2 data-i18n="last30"></h2></div>
          <div id="chart"></div>
        </section>
      </div>
    </section>

    <!-- 設定 -->
    <section class="tab" id="tab-settings" hidden>
      <header class="page-head"><h1 data-i18n="settingsTitle"></h1>
        <button class="btn" id="testBreakBtn"><span aria-hidden="true" class="ms">preview</span><span data-i18n="testBreak"></span></button>
      </header>
      <div class="set-grid">
        <div class="panel">
          <div class="panel-head"><h2 data-i18n="hours"></h2></div>
          <div class="field"><label for="sStart" data-i18n="start"></label><input type="text" class="hm" id="sStart" name="start" autocomplete="off" inputmode="numeric" maxlength="5" placeholder="10:00" spellcheck="false"></div>
          <div class="field"><label for="sEnd" data-i18n="end"></label><input type="text" class="hm" id="sEnd" name="end" autocomplete="off" inputmode="numeric" maxlength="5" placeholder="21:00" spellcheck="false"></div>
          <div class="field"><label for="sInterval" data-i18n="interval"></label><input type="number" id="sInterval" name="interval" autocomplete="off" inputmode="numeric" min="5" max="600" step="5"></div>
          <div class="field"><label data-i18n="workdays"></label><div class="days" id="sDays"></div></div>
          <div class="field"><label data-i18n="walkReminder"></label><button class="switch" id="sNotify" data-i18n-aria="walkReminder"></button></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2 data-i18n="general"></h2></div>
          <div class="field"><label data-i18n="todayIs"></label><div class="seg" id="sCycle"></div></div>
          <div class="field"><label data-i18n="appearance"></label><div class="seg" id="sTheme"><button data-t="dark" data-i18n="dark"></button><button data-t="light" data-i18n="light"></button></div></div>
          <div class="field"><label data-i18n="language"></label><div class="seg" id="sLang"><button data-l="zh" lang="zh-Hant-TW">繁中</button><button data-l="en" lang="en">English</button></div></div>
          <div class="field"><label data-i18n="demo"></label><button class="switch" id="sShowDemo" data-i18n-aria="demo"></button></div>
          <div class="field" id="sDemoRow"><label for="sDemo" data-i18n="demoSec"></label><div class="inline"><input type="range" id="sDemo" min="5" max="10" step="1"><span id="sDemoVal" class="val"></span></div></div>
          <div class="field"><label data-i18n="launchAtLogin"></label><button class="switch" id="sLaunch" data-i18n-aria="launchAtLogin"></button></div>
        </div>
        <div class="panel span2">
          <div class="panel-head"><h2 data-i18n="overrides"></h2></div>
          <div class="ov-grid" id="overrides"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="player" hidden>
    <div class="player-card">
      <div class="clip" id="playerClip"></div>
      <div class="player-side">
        <h2 id="playerName"></h2>
        <div class="player-meta" id="playerMeta"></div>
        <ul class="tips" id="playerTips"></ul>
        <button class="btn" id="playerClose"><span aria-hidden="true" class="ms">close</span><span data-i18n="close"></span></button>
      </div>
    </div>
  </div>
<script src="clip.js"></script>
<script src="main.js"></script>
</body>
</html>
