<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file:; font-src 'self' file:; img-src 'self' data: file:">
<title>BreakFit</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/noto-sans-tc/wght.css">
<link rel="stylesheet" href="../../node_modules/material-symbols/outlined.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="main.css">
</head>
<body>
  <nav id="side">
    <div class="brand"><span class="logo"></span><span class="brand-name">BreakFit</span></div>
    <button class="nav-item active" data-tab="today" title="今天"><span class="ms">today</span><span class="nav-label">今天</span></button>
    <button class="nav-item" data-tab="history" title="記錄"><span class="ms">calendar_month</span><span class="nav-label">記錄</span></button>
    <button class="nav-item" data-tab="settings" title="設定"><span class="ms">tune</span><span class="nav-label">設定</span></button>
  </nav>

  <main id="content">
    <!-- 今天 -->
    <section class="tab" id="tab-today">
      <header class="page-head">
        <div class="head-text"><div class="eyebrow" id="todayLabel"></div><h1 id="todayTitle"></h1></div>
        <button class="btn primary" id="breakNowBtn"><span class="ms fill">play_arrow</span>現在就休息</button>
      </header>
      <div class="cards" id="todayCards"></div>
      <div class="today-grid">
        <div class="panel">
          <div class="panel-head"><h2>時間表</h2></div>
          <ol class="timeline" id="timeline"></ol>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>動作示範庫</h2>
            <div class="seg" id="libFilter">
              <button data-f="d1" class="on">第 1 天</button><button data-f="d2">第 2 天</button><button data-f="d3">第 3 天</button>
            </div>
          </div>
          <div class="lib-grid" id="library"></div>
        </div>
      </div>
    </section>

    <!-- 記錄 -->
    <section class="tab" id="tab-history" hidden>
      <header class="page-head"><h1>記錄</h1></header>
      <div class="stat-cards" id="statCards"></div>
      <div class="hist-grid">
        <div class="hist-main">
          <div class="panel" id="calPanel">
            <div class="panel-head cal-head">
              <button class="icon-btn" id="prevMonth"><span class="ms">chevron_left</span></button>
              <h2 id="monthLabel"></h2>
              <button class="icon-btn" id="nextMonth"><span class="ms">chevron_right</span></button>
            </div>
            <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="cal" id="calendar"></div>
          </div>
          <div class="panel" id="chartPanel">
            <div class="panel-head"><h2>最近 30 個訓練日</h2></div>
            <div id="chart"></div>
          </div>
        </div>
        <aside class="panel detail" id="detail"></aside>
      </div>
    </section>

    <!-- 設定 -->
    <section class="tab" id="tab-settings" hidden>
      <header class="page-head"><h1>設定</h1>
        <button class="btn" id="testBreakBtn"><span class="ms">preview</span>測試休息畫面</button>
      </header>
      <div class="set-grid">
        <div class="panel">
          <div class="panel-head"><h2>時段</h2></div>
          <div class="field"><label>開始</label><input type="text" class="hm" id="sStart" maxlength="5" placeholder="10:00" spellcheck="false"></div>
          <div class="field"><label>結束</label><input type="text" class="hm" id="sEnd" maxlength="5" placeholder="21:00" spellcheck="false"></div>
          <div class="field"><label for="sInterval">間隔（分鐘）</label><input type="number" id="sInterval" min="5" max="600" step="5"></div>
          <div class="field"><label>上班日</label><div class="days" id="sDays"></div></div>
          <div class="field"><label>提醒走動</label><button class="switch" id="sNotify" aria-label="提醒走動"></button></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>一般</h2></div>
          <div class="field"><label>今天是</label><div class="seg" id="sCycle"></div></div>
          <div class="field"><label>配色</label><div class="seg" id="sTheme"><button data-t="dark">深色</button><button data-t="light">淺色</button></div></div>
          <div class="field"><label>示範</label><button class="switch" id="sShowDemo" aria-label="示範"></button></div>
          <div class="field" id="sDemoRow"><label for="sDemo">示範秒數</label><div class="inline"><input type="range" id="sDemo" min="5" max="10" step="1"><span id="sDemoVal" class="val"></span></div></div>
          <div class="field"><label>開機啟動</label><button class="switch" id="sLaunch" aria-label="開機啟動"></button></div>
        </div>
        <div class="panel span2">
          <div class="panel-head"><h2>菜單組數 / 次數</h2></div>
          <div class="ov-grid" id="overrides"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="player" hidden>
    <div class="player-card">
      <div class="clip" id="playerClip"></div>
      <div class="player-side">
        <h2 id="playerName"></h2>
        <div class="player-meta" id="playerMeta"></div>
        <ul class="tips" id="playerTips"></ul>
        <button class="btn" id="playerClose"><span class="ms">close</span>關閉</button>
      </div>
    </div>
  </div>
<script src="clip.js"></script>
<script src="main.js"></script>
</body>
</html>
