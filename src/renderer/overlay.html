<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file:; font-src 'self' file:; img-src 'self' data: file:">
<title data-i18n-doc="breakTime">休息時間</title>
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="../../node_modules/@fontsource-variable/noto-sans-tc/wght.css">
<link rel="stylesheet" href="../../node_modules/material-symbols/outlined.css">
<script src="../i18n.js"></script>
<script src="theme.js"></script>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="pipDrag"></div>
  <header id="top">
    <div class="top-l">
      <span class="slot-badge"><span aria-hidden="true" class="ms">schedule</span><span id="slotText"></span></span>
      <span class="mode-tag" id="modeTag" hidden></span>
      <div class="top-prog"><div id="progFill"></div></div>
    </div>
    <div class="top-r">
      <button class="btn ghost" id="minBtn" hidden><span aria-hidden="true" class="ms">remove</span></button>
      <button class="btn ghost vbtn" id="pipBtn" data-v="pip"><span aria-hidden="true" class="ms">picture_in_picture_alt</span></button>
      <button class="btn ghost vbtn" id="winBtn" data-v="window"><span aria-hidden="true" class="ms">select_window</span><kbd>F</kbd></button>
      <button class="btn ghost vbtn" id="fullBtn" data-v="full"><span aria-hidden="true" class="ms">fullscreen</span><kbd>F</kbd></button>
      <button class="btn ghost" id="leaveBtn"><span aria-hidden="true" class="ms">logout</span><span data-i18n="leave"></span><kbd>Esc</kbd></button>
    </div>
  </header>

  <!-- One fixed stage for every phase: video box left, panel right (DESIGN.md §4). -->
  <main id="stage">
    <div class="vbox">
      <div class="clip" id="clipMain"></div>
      <div class="vcover" id="vCover" hidden></div>
    </div>
    <aside id="panel">
      <div class="p-head">
        <div class="p-chip" id="pChip"></div>
        <h1 class="p-title" id="pTitle"></h1>
        <div class="p-meta" id="pMeta"></div>
      </div>
      <div class="p-body" id="pBody"></div>
      <div class="p-foot">
        <div class="p-sec" id="pSec"></div>
        <div class="p-pri" id="pPri"></div>
      </div>
    </aside>
  </main>

  <!-- PIP only (DESIGN.md §4b): the one dense row on / under / beside the clip; #pSec / #pPri move in here -->
  <section id="pipBar" aria-live="off">
    <div class="pb-info"><div class="pb-name" id="pbName"></div><div class="pb-ctx" id="pbCtx"></div></div>
    <div class="pb-tips" id="pbTips"></div>
    <div class="pb-num" id="pbNum"></div>
    <div class="pb-acts" id="pbActs"></div>
  </section>

  <div id="modal" hidden>
    <div class="modal-card">
      <h2 id="mTitle"></h2>
      <p id="mBody"></p>
      <div class="modal-btns">
        <button class="btn" id="mCancel"></button>
        <button class="btn danger" id="mOk"></button>
      </div>
    </div>
  </div>
<span id="grip" aria-hidden="true"></span>
<script src="clip.js"></script>
<script src="overlay.js"></script>
</body>
</html>
